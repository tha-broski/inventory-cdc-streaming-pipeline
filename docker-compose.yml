services:

  kafka:
    image: apache/kafka:4.3.1

    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  
  kafka-init:
    image: apache/kafka:4.3.1

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic inventory.products.dlq \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic inventory.warehouses.dlq \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:9092 \
        --create \
        --if-not-exists \
        --topic inventory.inventory.dlq \
        --partitions 1 \
        --replication-factor 1

  postgres-source:
    image: postgres:17

    command: ["postgres", "-c", "wal_level=logical"]

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_source_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-target:
    image: postgres:17

    environment:
        POSTGRES_USER: ${TARGET_POSTGRES_USER}
        POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD}
        POSTGRES_DB: ${TARGET_POSTGRES_DB}

    ports: 
      - "5434:5432"

    volumes:
      - postgres_target_data:/var/lib/postgresql/data
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_POSTGRES_USER} -d {TARGET_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      

  connect:
    image: quay.io/debezium/connect:3.6
    
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider

    ports:
      - "8083:8083"
    
    depends_on:
      - kafka

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  connector-init:
    image: curlimages/curl:latest

    depends_on:
      connect:
        condition: service_healthy

    volumes:
      - ./config:/config:ro

    command:
      [
        "-X",
        "PUT",
        "-H",
        "Content-Type: application/json",
        "--data-binary",
        "@/config/debezium-postgres-source-config.json",
        "http://connect:8083/connectors/inventory-postgres-source/config"
      ]

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    volumes:
      - ./src:/opt/spark-app
      - ./checkpoints:/opt/spark-checkpoints
    environment:
      TARGET_POSTGRES_USER: ${TARGET_POSTGRES_USER}
      TARGET_POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD}
      TARGET_POSTGRES_DB: ${TARGET_POSTGRES_DB}
    depends_on:
      - kafka
      
volumes: 
  postgres_source_data:
  postgres_target_data:
  kafka_data:

